[project]
name = "fastapi-setup"
version = "0.1.0"
description = "this is a fastapi setup to learn how to use fastapi, and be comfortable with it."
readme = "README.md"
authors = [
    { name = "Deelolade", email = "oluwanisholahabeeb13@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "boto3>=1.43.114",
    "fastapi[standard]>=0.142.2",
    "greenlet>=3.5.6",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
fastapi-setup = "fastapi_setup:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
